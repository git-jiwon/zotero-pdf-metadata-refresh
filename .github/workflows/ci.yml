name: Public source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm run test:public
      - run: npm run release:check -- --development
      - run: npm run build
      - name: Require release configuration for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run release:check -- --skip-artifact-hash
      - name: Build the versioned release package
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run build:release
      - name: Verify the release package checksum
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run release:check
